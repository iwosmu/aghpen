- id: joomla-installer
  name: Joomla – niedokończona instalacja
  category: cms
  technology: Joomla
  description: Instalator Joomla jest dostępny publicznie. Kto pierwszy go ukończy, przejmuje witrynę.
  interest: 70
  classes: [admin-panel, install-page]
  match:
    condition: all
    rules:
      # Joomla 4-6: "Joomla Installer"; Joomla 3: "Joomla! Web Installer".
      - {type: title, regex: 'Joomla!? (?:Web )?Installer', weight: 0.9}
      - {type: url, contains: '/installation/', weight: 0.6}

