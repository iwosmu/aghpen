- id: nextcloud
  name: Nextcloud
  category: cms
  description: Chmura plików Nextcloud.
  tags: [php, pliki]
  interest: 25
  classes: [login]
  cpe: cpe:2.3:a:nextcloud:nextcloud_server
  implies: [PHP]
  match:
    min_confidence: 0.5
    rules:
      - {type: path, path: /status.php, status: [200], regex: '"productname"\s*:\s*"Nextcloud"', weight: 0.95}
      - {type: cookie, name_regex: '^nc_sameSiteCookie(lax|strict)$', weight: 0.8}
      - {type: body, regex: 'apple-itunes-app" content="app-id=1125420102|/core/img/favicon(?:-touch)?\.(?:ico|png)|Nextcloud', weight: 0.5}
      - {type: favicon, mmh3: [167837543], weight: 0.9}
      # The first-run installer is nextcloud-installer (install-page, not a login).
      - {type: body, contains: '/dist/core-install.js', not: true}
  version:
    - {type: path, path: /status.php, regex: '"versionstring"\s*:\s*"([0-9.]+)'}

- id: nextcloud-installer
  name: Nextcloud – niedokończona instalacja
  category: cms
  technology: Nextcloud
  description: Kreator pierwszego uruchomienia Nextcloud jest dostępny. Kto go wypełni, zakłada konto administratora i wskazuje bazę danych.
  tags: [php, pliki, install]
  interest: 80
  classes: [admin-panel, install-page]
  cpe: cpe:2.3:a:nextcloud:nextcloud_server
  implies: [PHP]
  match:
    min_confidence: 0.8
    rules:
      # Nextcloud 25+ loads the installer bundle dist/core-install.js; older releases core/js/install.js.
      - {type: body, regex: '/dist/core-install\.js|/core/js/install\.js', weight: 0.85}
      - {type: title, regex: '^\s*Nextcloud\s*$', weight: 0.3}
      - {type: path, path: /status.php, status: [200], regex: '"installed"\s*:\s*false', weight: 0.6}
  version:
    - {type: path, path: /status.php, regex: '"versionstring"\s*:\s*"([0-9.]+)'}

