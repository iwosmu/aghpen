# Czujka: sygnatury systemów CMS, portali, wiki, forów i poczty webowej.
# Składnia: docs/SIGNATURES.md. Hasze favicon policzono z prawdziwych instancji (cmd/fpprobe/testlab).

- id: wordpress
  name: WordPress
  category: cms
  description: System zarządzania treścią WordPress.
  tags: [php, blog]
  interest: 10
  cpe: cpe:2.3:a:wordpress:wordpress
  implies: [PHP]
  match:
    min_confidence: 0.5
    rules:
      - {type: meta, name: generator, regex: '^WordPress(?: ([0-9.]+))?', weight: 0.9, version_group: 1}
      - {type: body, regex: '/wp-(?:content|includes)/', weight: 0.6}
      - {type: header, name: Link, contains: 'api.w.org', weight: 0.8}
      - {type: header, name: X-Pingback, contains: 'xmlrpc.php', weight: 0.7}
      - {type: header, name: X-Redirect-By, equals: WordPress, weight: 0.9}
      - {type: cookie, name_regex: '^(wordpress_|wp-settings-|wp_woocommerce_)', weight: 0.7}
      - {type: path, path: /wp-login.php, status: [200], contains: 'user_login', weight: 0.9}
      - {type: path, path: /robots.txt, status: [200], contains: '/wp-admin/', weight: 0.6}
  version:
    - {type: body, regex: 'wp-emoji-release\.min\.js\?ver=([0-9.]+)'}

- id: wordpress-login
  name: WordPress – strona logowania
  category: cms
  technology: WordPress
  description: Dostępny publicznie formularz logowania wp-login.php.
  tags: [php, login]
  interest: 30
  classes: [login, admin-panel]
  match:
    rules:
      - {type: path, path: /wp-login.php, status: [200], contains_all: ['user_login', 'wp-submit'], weight: 0.95}
      - {type: body, contains_all: ['id="loginform"', 'wp-submit'], weight: 0.9}

- id: joomla
