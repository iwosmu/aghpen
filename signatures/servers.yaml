- id: tomcat
  name: Apache Tomcat
  category: app-server
  description: Kontener serwletów Apache Tomcat.
  tags: [java]
  cpe: cpe:2.3:a:apache:tomcat
  implies: [Java]
  aliases: ['Apache Tomcat/Coyote JSP engine', Tomcat]
  match:
    min_confidence: 0.5
    rules:
      - {type: title, regex: '^Apache Tomcat(?:/([0-9.]+))?', weight: 0.9, version_group: 1}
      - {type: body, regex: '<h3>Apache Tomcat/([0-9.]+)', weight: 0.9, version_group: 1}
      - {type: header, name: Server, regex: 'Apache-Coyote|Tomcat', weight: 0.8}
      - {type: favicon, mmh3: [-297069493], weight: 0.9}
      - {type: service, field: product, regex: 'Apache Tomcat', weight: 0.8}
      - {type: path, path: /manager/html, status: [401, 403], regex: 'Tomcat Manager Application|tomcat-users\.xml|manager-gui', weight: 0.9}
      - {type: path, path: /manager/html, status: [401], field: header, name: WWW-Authenticate, contains: 'Tomcat Manager', weight: 0.9}

