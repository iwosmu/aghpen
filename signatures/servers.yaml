# Czujka: sygnatury serwerów WWW, serwerów aplikacji, proxy i ich stron domyślnych.

- id: nginx
  name: nginx
  category: web-server
  description: Serwer WWW i reverse proxy nginx.
  cpe: cpe:2.3:a:f5:nginx
  match:
    rules:
      - {type: header, name: Server, regex: '^nginx(?:/([0-9.]+))?', weight: 0.9, version_group: 1}
      - {type: body, regex: '<hr><center>nginx(?:/([0-9.]+))?</center>', weight: 0.9, version_group: 1}
      - {type: service, field: product, regex: '^nginx', weight: 0.8}
  version:
    - {type: service, field: version, regex: '^([0-9][0-9.]*)'}

- id: nginx-default-page
  name: nginx – strona domyślna
  category: web-server
  technology: nginx
  description: Serwer pokazuje stronę powitalną nginx. Usługa jest zainstalowana, ale nie skonfigurowana.
  interest: 15
  classes: [default-page]
  match:
    rules:
      - {type: title, equals: 'Welcome to nginx!', weight: 0.9}
      - {type: body, contains: 'If you see this page, nginx is successfully installed', weight: 0.9}

- id: apache
  name: Apache HTTP Server
  category: web-server
  description: Serwer WWW Apache httpd.
  cpe: cpe:2.3:a:apache:http_server
  aliases: ['Apache httpd', Apache]
  match:
    rules:
      - {type: header, name: Server, regex: '^Apache(?:/([0-9.]+))?(?:\s|$)', weight: 0.9, version_group: 1}
      - {type: body, regex: '<address>Apache(?:/([0-9.]+))?[^<]* Server at ', weight: 0.9, version_group: 1}
      - {type: service, field: product, regex: '^Apache httpd', weight: 0.8}
  version:
    - {type: service, field: version, regex: '^([0-9][0-9.]*)'}

- id: apache-default-page
  name: Apache – strona domyślna
  category: web-server
  technology: Apache HTTP Server
  description: Serwer pokazuje stronę domyślną Apache („It works!”, strona Debiana, Ubuntu albo CentOS).
  interest: 15
  classes: [default-page]
  match:
    rules:
      - {type: body, regex: '<h1>It works!</h1>|<p>It works!</p>', weight: 0.8}
      - {type: title, regex: '^Apache2 (?:Ubuntu|Debian) Default Page|^It works! Apache httpd$|Test Page for the (?:Apache HTTP Server|HTTP Server)|^Apache HTTP Server Test Page', weight: 0.9}

- id: apache-server-status
  name: Apache – server-status
  category: environment
  description: Strona mod_status jest dostępna publicznie. Pokazuje adresy klientów i żądane adresy URL.
  interest: 55
  match:
    rules:
      - {type: path, path: /server-status, status: [200], contains_all: ['Apache Server Status', 'Server uptime'], weight: 0.95}

