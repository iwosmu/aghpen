# Czujka: panele administracyjne, narzędzia deweloperskie, monitoring, bazy danych z interfejsem HTTP.
# Hasze favicon policzono z prawdziwych instancji (cmd/fpprobe/testlab).

- id: phpmyadmin
  name: phpMyAdmin
  category: panel
  description: Panel administracyjny baz MySQL/MariaDB phpMyAdmin.
  tags: [php, baza-danych]
  interest: 60
  classes: [admin-panel, login, database]
  cpe: cpe:2.3:a:phpmyadmin:phpmyadmin
  implies: [PHP]
  match:
    min_confidence: 0.5
    rules:
      - {type: cookie, name_regex: '^(phpMyAdmin|pma_lang|pmaUser-[0-9]+)', weight: 0.9}
      - {type: title, regex: '^phpMyAdmin', weight: 0.8}
      - {type: body, regex: 'name="pma_username"|pmahomme|phpmyadmin\.css\.php|PMA_commonParams', weight: 0.8}
      - {type: favicon, mmh3: [-476231906], weight: 0.9}
      - {type: path, path: /phpmyadmin/, status: [200], regex: 'name="pma_username"|pmahomme|PMA_commonParams', weight: 0.9}
      - {type: path, path: /pma/, status: [200], regex: 'name="pma_username"|pmahomme|PMA_commonParams', weight: 0.9}
  version:
    - {type: body, regex: '(?:\.css|\.js)\?v=([0-9]+\.[0-9]+\.[0-9]+)'}
    - {type: body, regex: 'PMA_VERSION:"([0-9.]+)"'}

