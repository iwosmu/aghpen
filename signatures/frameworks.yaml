# Czujka: sygnatury frameworków, języków, bibliotek i generatorów stron.

- id: php
  name: PHP
  category: language
  description: Interpreter PHP ujawniony w nagłówku albo ciasteczku sesji.
  cpe: cpe:2.3:a:php:php
  match:
    rules:
      - {type: header, name: X-Powered-By, regex: '^PHP(?:/([0-9.]+))?', weight: 0.9, version_group: 1}
      - {type: header, name: Server, regex: 'PHP/([0-9.]+)', weight: 0.8, version_group: 1}
      - {type: cookie, name: PHPSESSID, weight: 0.7}

- id: php-builtin-server
  name: PHP – wbudowany serwer deweloperski
  category: web-server
  technology: PHP
  description: Serwer „php -S” jest narzędziem deweloperskim i nie powinien działać produkcyjnie.
  interest: 40
  classes: [staging]
  match:
    rules:
      - {type: header, name: Server, regex: 'PHP [0-9.]+ Development Server', weight: 0.95}
  version:
    - {type: header, name: Server, regex: 'PHP ([0-9.]+) Development Server'}

