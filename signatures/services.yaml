# Czujka: usługi inne niż HTTP, rozpoznawane po banerze albo po wyniku nmap (nazwa, produkt, wersja).

- id: openssh
  name: OpenSSH
  category: other
  description: Serwer SSH OpenSSH.
  tags: [ssh]
  interest: 15
  classes: [remote-access]
  cpe: cpe:2.3:a:openbsd:openssh
  match:
    rules:
      - {type: banner, regex: '^SSH-[0-9.]+-OpenSSH[_-]([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:p[0-9]+)?)', weight: 0.95, version_group: 1}
      - {type: service, field: product, regex: '^OpenSSH', weight: 0.9}
  version:
    - {type: service, field: version, regex: '^([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:p[0-9]+)?)'}

- id: dropbear
  name: Dropbear SSH
  category: other
  description: Lekki serwer SSH Dropbear, typowy dla routerów i urządzeń wbudowanych.
  tags: [ssh, wbudowany]
  interest: 30
  classes: [remote-access, iot]
  cpe: cpe:2.3:a:dropbear_ssh_project:dropbear_ssh
  aliases: ['Dropbear sshd']
  match:
    rules:
      - {type: banner, regex: '^SSH-[0-9.]+-dropbear(?:_([0-9.]+))?', weight: 0.95, version_group: 1}
      - {type: service, field: product, regex: '^Dropbear', weight: 0.9}

- id: ssh-protocol-1
  name: SSH w wersji protokołu 1
  name_en: SSH protocol version 1
  category: other
  technology: false
  description: Serwer SSH przyjmuje przestarzały protokół SSH-1 (baner SSH-1.x). Protokół ma znane słabości kryptograficzne.
  tags: [ssh]
  interest: 70
  classes: [remote-access]
  match:
    rules:
      - {type: banner, regex: '^SSH-1\.(?:5|99)-', weight: 0.95}

- id: telnet
  name: Telnet
  category: other
  technology: false
  description: Usługa Telnet. Przesyła hasła i polecenia bez szyfrowania.
  tags: [telnet]
  interest: 70
  classes: [remote-access]
  match:
    rules:
      - {type: service, field: name, regex: '^telnets?$', weight: 0.9}

- id: rdp
  name: Pulpit zdalny (RDP)
  name_en: Remote desktop (RDP)
  category: other
  description: Usługa pulpitu zdalnego Microsoft RDP.
  tags: [rdp, microsoft]
  interest: 60
  classes: [remote-access]
  technology: Microsoft Terminal Services
  aliases: ['Microsoft Terminal Services', 'xrdp']
  match:
    rules:
      - {type: service, field: name, regex: '^(?:ms-wbt-server|rdp)$', weight: 0.9}
      - {type: service, field: product, regex: 'Terminal Services|xrdp', weight: 0.9}

- id: vnc
  name: VNC
  category: other
  description: Zdalny pulpit VNC.
  tags: [vnc]
  interest: 65
  classes: [remote-access]
  match:
    rules:
      - {type: banner, regex: '^RFB ([0-9]{3}\.[0-9]{3})', weight: 0.95}
      - {type: service, field: name, regex: '^vnc', weight: 0.9}

- id: vsftpd
  name: vsftpd
  category: other
  description: Serwer FTP vsftpd.
  tags: [ftp]
  interest: 30
  cpe: cpe:2.3:a:vsftpd_project:vsftpd
  match:
    rules:
      - {type: banner, regex: '\(vsFTPd ([0-9.]+)\)', weight: 0.95, version_group: 1}
      - {type: service, field: product, regex: '^vsftpd', weight: 0.9}

- id: proftpd
  name: ProFTPD
  category: other
