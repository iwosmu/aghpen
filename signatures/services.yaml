      - {type: service, field: product, regex: '^Microsoft SQL Server', weight: 0.9}
      - {type: service, field: name, regex: '^ms-sql-[sm]$', weight: 0.8}

- id: oracle-db
  name: Oracle Database (TNS)
  category: database
  description: Nasłuch Oracle TNS dostępny w sieci.
  tags: [baza-danych, oracle]
  interest: 65
  cpe: cpe:2.3:a:oracle:database_server
  aliases: ['Oracle TNS listener']
  match:
    rules:
