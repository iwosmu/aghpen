- id: mqtt
  name: MQTT
  category: other
  technology: false
  description: Broker MQTT (często Mosquitto), typowy dla IoT. Bez uwierzytelniania pozwala czytać i wysyłać komunikaty urządzeń.
  tags: [iot, kolejki]
  interest: 60
  classes: [iot]
  match:
    rules:
      - {type: service, field: name, regex: '^(?:mqtt|secure-mqtt)$|(?i)^mosquitto version', weight: 0.8}
      - {type: service, field: product, regex: 'Mosquitto|MQTT', weight: 0.9}

- id: mosquitto
  name: Mosquitto
  category: other
  description: Broker MQTT Eclipse Mosquitto. nmap 7.97 zgłasza go jako nazwę usługi „mosquitto version X” bez pola produktu.
  tags: [iot, kolejki]
  interest: 40
  classes: [iot]
  cpe: cpe:2.3:a:eclipse:mosquitto
  match:
    rules:
      - {type: service, field: name, regex: '(?i)^mosquitto version ([0-9]+\.[0-9]+(?:\.[0-9]+)?)', weight: 0.95, version_group: 1}
      - {type: service, field: product, regex: '(?i)^(?:eclipse )?mosquitto', weight: 0.9}
  version:
    - {type: service, field: version, regex: '^([0-9]+\.[0-9]+(?:\.[0-9]+)?)'}

- id: rtsp
  name: RTSP (strumień wideo)
  name_en: RTSP (video stream)
  category: iot
  technology: false
  description: Usługa strumieniowania RTSP, typowa dla kamer i rejestratorów.
  tags: [kamera]
  interest: 50
  match:
    rules:
      - {type: service, field: name, equals: rtsp, weight: 0.8}
      - {type: banner, regex: '^RTSP/1\.0 ', weight: 0.9}
      # nmap names some HTTP servers rtsp (Keycloak 26 on Quarkus answers its probe with 400): an HTTP answer vetoes.
      - {type: status, status: [200, 204, 301, 302, 303, 307, 308, 401, 403, 404], not: true}

- id: ics-protocol
  name: Protokół przemysłowy (Modbus, S7, BACnet, DNP3, EtherNet/IP)
  name_en: "Industrial protocol (Modbus, S7, BACnet, DNP3, EtherNet/IP)"
  category: iot
  technology: false
  description: Usługa protokołu automatyki przemysłowej albo budynkowej dostępna w sieci. Te protokoły nie mają uwierzytelniania.
  tags: [ics]
  interest: 90
  match:
    rules:
      - {type: service, field: name, regex: '^(?:modbus|iso-tsap|s7comm|bacnet|dnp3?|enip|EtherNet-IP-[12]|fox|omron-fins|iec-104|opcua|codesys|pcworx|proconos|hart-ip)', weight: 0.85}

- id: rsync
  name: rsync
  category: other
  description: Demon rsync dostępny w sieci. Moduły bez hasła pozwalają pobierać pliki.
  tags: [pliki]
  interest: 55
  match:
    rules:
      - {type: banner, regex: '^@RSYNCD: ([0-9.]+)', weight: 0.95, version_group: 1}
      - {type: service, field: name, equals: rsync, weight: 0.8}

- id: jdwp
  name: Java Debug Wire Protocol
  category: environment
  description: Port debugowania Javy (JDWP) dostępny w sieci. Pozwala wykonać kod w maszynie wirtualnej.
