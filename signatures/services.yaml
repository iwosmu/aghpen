  match:
    rules:
      - {type: service, field: product, regex: '^MariaDB', weight: 0.9}
      - {type: banner, regex: '([0-9]+\.[0-9]+\.[0-9]+)-MariaDB', weight: 0.95, version_group: 1}
      - {type: service, field: version, regex: '([0-9]+\.[0-9]+\.[0-9]+)-MariaDB', weight: 0.9, version_group: 1}

- id: postgresql
  name: PostgreSQL
  category: database
