- id: mongodb
  name: MongoDB
  category: database
  description: Serwer MongoDB dostępny w sieci. Starsze instalacje nie wymagają uwierzytelniania.
  tags: [baza-danych]
  interest: 75
  cpe: cpe:2.3:a:mongodb:mongodb
  match:
    rules:
      - {type: service, field: product, regex: '^MongoDB', weight: 0.9}
      - {type: service, field: name, regex: '^mongo(?:db|d)$', weight: 0.8}
      - {type: body, contains: 'It looks like you are trying to access MongoDB over HTTP on the native driver port', weight: 0.95}

- id: redis
  name: Redis
  category: database
  description: Serwer Redis dostępny w sieci. Domyślnie nie wymaga hasła.
  tags: [baza-danych]
  interest: 80
  cpe: cpe:2.3:a:redis:redis
  aliases: ['Redis key-value store']
  match:
    rules:
      - {type: service, field: product, regex: '^Redis', weight: 0.9}
      - {type: service, field: name, equals: redis, weight: 0.8}
      - {type: banner, regex: '^-(?:NOAUTH|DENIED Redis|ERR (?:wrong number of arguments|unknown command))', weight: 0.9}

- id: memcached
  name: Memcached
  category: database
  description: Serwer Memcached dostępny w sieci. Nie ma uwierzytelniania i bywa używany do ataków wzmocnionych.
  tags: [baza-danych]
  interest: 75
  cpe: cpe:2.3:a:memcached:memcached
  match:
    rules:
      - {type: service, field: product, regex: '^Memcached', weight: 0.9}
      - {type: service, field: name, regex: '^memcached?$', weight: 0.8}

- id: samba
