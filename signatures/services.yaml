      - {type: service, field: product, regex: '^Dovecot', weight: 0.9}

- id: mysql
  name: MySQL
  category: database
  description: Serwer baz danych MySQL dostępny w sieci.
  tags: [baza-danych]
  interest: 60
  cpe: cpe:2.3:a:oracle:mysql
  match:
    rules:
      - {type: service, field: product, regex: '^MySQL', weight: 0.9}
      - {type: banner, regex: '^.{0,8}([0-9]+\.[0-9]+\.[0-9]+)[^\x00]*\x00[\s\S]*mysql_native_password', weight: 0.6, version_group: 1}
      - {type: banner, regex: 'is not allowed to connect to this MySQL server', weight: 0.95}
  version:
    - {type: service, field: version, regex: '^([0-9]+\.[0-9]+\.[0-9]+)'}

- id: mariadb
  name: MariaDB
  category: database
  description: Serwer baz danych MariaDB dostępny w sieci.
  tags: [baza-danych]
  interest: 60
