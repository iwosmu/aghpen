  cpe: cpe:2.3:a:proftpd:proftpd
  match:
    rules:
      - {type: banner, regex: 'ProFTPD(?: ([0-9.]+[a-z]?))? Server', weight: 0.95, version_group: 1}
      - {type: service, field: product, regex: '^ProFTPD', weight: 0.9}

- id: pure-ftpd
  name: Pure-FTPd
  category: other
  description: Serwer FTP Pure-FTPd.
  tags: [ftp]
  interest: 30
  match:
    rules:
      - {type: banner, regex: 'Pure-FTPd', weight: 0.95}
      - {type: service, field: product, regex: '^Pure-FTPd', weight: 0.9}

- id: ftp-generic
  name: FTP
