id: nuclei-inertiajs-detect
name: Inertia.js
category: other
description: 'Detected Inertia.js passively using a single plain GET request with no special headers. It matched four server-emitted Inertia-specific signals on the initial document: three proximity-bound body patterns covering the embedded page object formats and one `Vary: X-Inertia` response header signal set by supported middleware adapters.'
author: 'antonkulyk, marcialpaulg'
source: 'projectdiscovery/nuclei-templates@1ad258956016 http/technologies/inertiajs-detect.yaml id=inertiajs-detect licence=MIT'
tags: [tech, inertiajs, inertia, nuclei-templates]
interest: 10
match:
  rules:
    - {type: body, regex: 'data-page="[^"]*&quot;component&quot;[^"]*&quot;props&quot;[^"]*&quot;url&quot;', case_sensitive: true, weight: 0.8}
    - {type: body, regex: 'data-page=''[^'']*"component":[^'']*"props":[^'']*"url":', case_sensitive: true, weight: 0.8}
    - {type: body, regex: '<script[^>]*data-page=["''][^>]*>[^<]*"component":[^<]*"props":[^<]*"url":', case_sensitive: true, weight: 0.8}
    - {type: header, regex: '(?im)^vary:[^\r\n]*x-inertia', case_sensitive: true, weight: 0.8}
