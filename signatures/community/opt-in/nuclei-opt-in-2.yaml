category: panel
description: Scalar API documentation panel was detected.
author: recepgunes
source: 'projectdiscovery/nuclei-templates@1ad258956016 http/exposed-panels/scalar-detection.yaml id=scalar-detection licence=MIT'
tags: [panel, scalar, api, documentation, detect, discovery, nuclei-templates, opt-in-path]
