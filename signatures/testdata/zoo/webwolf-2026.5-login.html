<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
>
<head>
    <title>WebWolf</title>
    <div>
        <link rel="shortcut icon" href="/WebWolf/css/img/webwolf.ico" type="image/x-icon"/>
        <link rel="stylesheet" href="/WebWolf/css/bootstrap-icons.css"/>
        <link rel="stylesheet" type="text/css" href="/WebWolf/webjars/bootstrap/5.3.5/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="/WebWolf/css/webwolf.css"/>
        <script src="/WebWolf/webjars/jquery/4.0.0/jquery.min.js"></script>
        <script src="/WebWolf/webjars/bootstrap/5.3.5/js/bootstrap.min.js"></script>
    </div>
</head>
<body>

<div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/WebWolf/home">WebWolf</a>

        <ul class="nav navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/WebWolf/home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/WebWolf/files">Files</a></li>
            <li class="nav-item"><a class="nav-link" href="/WebWolf/requests">Incoming requests</a></li>
            <li class="nav-item"><a class="nav-link" href="/WebWolf/jwt">JWT</a></li>
        </ul>
        <ul class="navbar-nav position-absolute end-0 mx-3">
            <li class="nav-item"><a class="nav-link" href="#">
                        </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/WebWolf/logout">
                        </a>
            </li>
        </ul>
</div>

<div class="container">

    <div class="row" style="margin-top:100px">
        <div class="col-xs-12 col-sm-8 col-md-6 col-sm-offset-2 col-md-offset-3" style="background:url(/WebWolf/images/wolf.png) no-repeat right;">
            <form action="/WebWolf/login" method="post">
                <fieldset>
                    <h2>Sign in</h2>
                    <br/>
                    
                    

                    <div class="input-group mb-3">
                        <input type="text" name="username" id="username" class="form-control"
                               placeholder="Username WebGoat" required="true" autofocus="true"/>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="Password WebGoat" required="true"/>
                    </div>

                    <div class="row">
                        <div class="col-xs-6 col-sm-6 col-md-6">
                            <input type="submit" class="btn btn-lg btn-primary btn-block" value="Sign In"/>
                        </div>
                        <div class="col-xs-6 col-sm-6 col-md-6">
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
        
    </div>

</div>

<footer>
            © 2017 - 2026 WebGoat - Use WebWolf at your own risk
        </footer>

</body>
</html>
