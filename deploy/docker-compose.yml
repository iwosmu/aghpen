# Czujka: the product stack.
#
#   cp deploy/.env.example deploy/.env      # then set your own secrets
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#
# The stack also starts without deploy/.env: the database is reachable only on
# the internal network, the master key is generated into a volume, and a random
# administrator password is printed once in the log of the czujka service.
name: czujka

services:
  db:
    build:
      context: ./db
    image: czujka-db:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: czujka
      POSTGRES_PASSWORD: ${CZUJKA_DB_PASSWORD:-czujka-internal-network-only}
      POSTGRES_DB: czujka
    volumes:
      - czujka-pgdata:/data/db
      # The pg_tde keyring is on its own volume: a copy of the data volume alone cannot be read.
      - czujka-tde-keys:/tde-keys
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U czujka -d czujka"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  czujka:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${CZUJKA_VERSION:-dev}
    image: czujka:${CZUJKA_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CZUJKA_DB_URL: postgres://czujka:${CZUJKA_DB_PASSWORD:-czujka-internal-network-only}@db:5432/czujka?sslmode=disable
      CZUJKA_TDE: ${CZUJKA_TDE:-require}
      CZUJKA_ADMIN_EMAIL: ${CZUJKA_ADMIN_EMAIL:-admin@czujka.local}
      CZUJKA_ADMIN_PASSWORD: ${CZUJKA_ADMIN_PASSWORD:-}
      CZUJKA_MASTER_KEY: ${CZUJKA_MASTER_KEY:-}
      CZUJKA_MASTER_KEY_OLD: ${CZUJKA_MASTER_KEY_OLD:-}
      CZUJKA_MASTER_KEY_FILE: /var/lib/czujka/master.key
      CZUJKA_COOKIE_SECURE: ${CZUJKA_COOKIE_SECURE:-auto}
      CZUJKA_TRUST_PROXY: ${CZUJKA_TRUST_PROXY:-false}
      CZUJKA_TZ: ${CZUJKA_TZ:-Europe/Warsaw}
    ports:
      - "${CZUJKA_BIND:-127.0.0.1}:${CZUJKA_PORT:-8080}:8080"
    volumes:
      - czujka-keys:/var/lib/czujka
    networks: [internal, scan]
    # Non-root user (see the Dockerfile) with exactly the two capabilities nmap needs.
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "czujka", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  internal:
    internal: true   # the database has no route out and no published port
  scan: {}           # the network the scanner reaches its targets through

volumes:
  czujka-pgdata:
  czujka-tde-keys:
  czujka-keys:
