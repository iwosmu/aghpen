# Czujka: the product stack.
#
#   cp deploy/.env.example deploy/.env      # then set your own secrets
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#
# The stack also starts without deploy/.env (in the repository root:
# docker compose up -d, through compose.yaml): the database password and the
# master key are generated into volumes on the first start, and a random
# administrator password is printed once in the log of the czujka service.
name: czujka

services:
  # Writes the database password into the volume czujka-secrets before the
  # database starts, so the stack needs no .env and the repository holds no
  # password. Order: CZUJKA_DB_PASSWORD from .env when set; else the password
  # already in the volume; else a new random one. A database volume created
  # before this service existed had a fixed password: it gets a new random one
  # too, and czujka moves the database role to it (db_password_legacy).
  secrets:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    network_mode: none
    environment:
      CZUJKA_DB_PASSWORD: ${CZUJKA_DB_PASSWORD:-}
    volumes:
      - czujka-secrets:/secrets
      - czujka-pgdata:/pgdata:ro
    command:
      - sh
      - -ec
      - |
        f=/secrets/db_password
        if [ -n "$$CZUJKA_DB_PASSWORD" ]; then
          printf '%s\n' "$$CZUJKA_DB_PASSWORD" > "$$f.tmp" && mv "$$f.tmp" "$$f"
          echo "secrets: database password from CZUJKA_DB_PASSWORD"
        elif [ -s "$$f" ]; then
          echo "secrets: database password kept"
        elif [ -f /pgdata/PG_VERSION ]; then
          # A database from an older version still has the old fixed password. It goes to
          # db_password_legacy; db_password gets a new random one, and czujka moves the
          # database role to it at its first connection (security review L5).
          printf '%s\n' czujka-internal-network-only > "$$f"_legacy
          chmod 0444 "$$f"_legacy
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
          echo >> "$$f"
          echo "secrets: existing database from an older version: czujka moves it to a new generated password"
        else
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
          echo >> "$$f"
          echo "secrets: generated a new database password"
        fi
        chmod 0444 "$$f"

  db:
    build:
      context: ./db
    image: czujka-db:17
    # Always build from this checkout (cached, a few seconds): an image left by an older checkout must not be reused.
    pull_policy: build
    restart: unless-stopped
    # SIGINT is PostgreSQL's fast shutdown: it ends the sessions and writes a checkpoint. On the
    # default SIGTERM it waits for every client to disconnect, the grace period ends and the
    # database is killed, so every restart went through crash recovery.
    stop_signal: SIGINT
    stop_grace_period: 1m
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: czujka
      POSTGRES_PASSWORD_FILE: /run/czujka-secrets/db_password
      POSTGRES_DB: czujka
    volumes:
      - czujka-secrets:/run/czujka-secrets:ro
      - czujka-pgdata:/data/db
      # The pg_tde keyring is on its own volume: a copy of the data volume alone cannot be read.
      - czujka-tde-keys:/tde-keys
    networks:
      internal:
        # A unique name: when Czujka joins a scanned network that has its own host called "db",
        # a short name could resolve to that host instead of this database.
        aliases: [czujka-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U czujka -d czujka"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  czujka:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${CZUJKA_VERSION:-dev}
    image: czujka:${CZUJKA_VERSION:-dev}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CZUJKA_DB_URL: postgres://czujka@czujka-postgres:5432/czujka?sslmode=disable
      CZUJKA_DB_PASSWORD_FILE: /run/czujka-secrets/db_password
      CZUJKA_TDE: ${CZUJKA_TDE:-require}
      CZUJKA_ADMIN_EMAIL: ${CZUJKA_ADMIN_EMAIL:-admin@czujka.local}
      CZUJKA_ADMIN_PASSWORD: ${CZUJKA_ADMIN_PASSWORD:-}
      CZUJKA_MASTER_KEY: ${CZUJKA_MASTER_KEY:-}
      CZUJKA_MASTER_KEY_OLD: ${CZUJKA_MASTER_KEY_OLD:-}
      CZUJKA_MASTER_KEY_FILE: /var/lib/czujka/master.key
      CZUJKA_COOKIE_SECURE: ${CZUJKA_COOKIE_SECURE:-auto}
      CZUJKA_TRUST_PROXY: ${CZUJKA_TRUST_PROXY:-false}
      CZUJKA_ALLOWED_NETWORKS: ${CZUJKA_ALLOWED_NETWORKS:-}
      CZUJKA_TZ: ${CZUJKA_TZ:-Europe/Warsaw}
      CZUJKA_SCHED_INTERVAL: ${CZUJKA_SCHED_INTERVAL:-20s}
      CZUJKA_LOG_FORMAT: ${CZUJKA_LOG_FORMAT:-json}
      # localhost, 127.x and ::1 as targets mean the docker host (host.docker.internal), not this container.
      # "off" keeps loopback as loopback; an IPv4 address overrides.
      CZUJKA_HOST_GATEWAY: ${CZUJKA_HOST_GATEWAY:-}
      # The port the docker host publishes the UI on: that service of the docker host is Czujka itself (tag "czujka").
      CZUJKA_PUBLISHED_PORT: ${CZUJKA_PORT:-8080}
      # Kernel packet cap (nftables in this container's own network namespace):
      # auto installs it when possible, require refuses to scan without it, off.
      CZUJKA_KERNEL_CAP: ${CZUJKA_KERNEL_CAP:-auto}
      # Hosts the rotating deep pass (rest of 1-65535) takes per run of a larger scope: 0 = off, max 64.
      CZUJKA_DEEP_PASS_HOSTS: ${CZUJKA_DEEP_PASS_HOSTS:-16}
    ports:
      - "${CZUJKA_BIND:-127.0.0.1}:${CZUJKA_PORT:-8080}:8080"
    volumes:
      - czujka-keys:/var/lib/czujka
      - czujka-secrets:/run/czujka-secrets:ro
    networks: [internal, scan]
    # A DefectDojo that runs on the docker host (lab/defectdojo) is reachable as http://host.docker.internal:<port>.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Non-root user (see the Dockerfile) with exactly the two capabilities nmap needs.
    # NET_ADMIN also lets nft install the kernel packet cap in this container's namespace.
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "czujka", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  internal:
    internal: true   # the database has no route out and no published port
  scan: {}           # the network the scanner reaches its targets through

volumes:
  czujka-secrets:
  czujka-pgdata:
  czujka-tde-keys:
  czujka-keys:
