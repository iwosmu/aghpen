# Local DefectDojo for Czujka integration tests and the demo.
# Official open-source images (defectdojo/defectdojo-django, defectdojo/defectdojo-nginx).
# Lab use only: the admin password and the API token below are public constants.
# Start:  docker compose -f lab/defectdojo/docker-compose.yml up -d
# Stop:   docker compose -f lab/defectdojo/docker-compose.yml down -v
name: czujka-dojo

x-dd-env: &dd-env
  DD_DEBUG: "False"
  DD_ALLOWED_HOSTS: "*"
  DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://valkey:6379/0
  DD_CACHE_URL: redis://valkey:6379/1
  DD_SECRET_KEY: "czujka-lab-secret-key-not-for-prod"
  DD_CREDENTIAL_AES_256_KEY: "czujka-lab-aes-key-not-for-prod!"
  DD_DATABASE_READINESS_TIMEOUT: "60"

x-dd-image: &dd-image "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:${DD_VERSION:-latest}"

services:
  nginx:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-nginx:${DD_VERSION:-latest}"
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - media:/usr/share/nginx/html/media
    ports:
      # 127.0.0.1 only: the lab instance is never exposed to the network.
      - "127.0.0.1:${DOJO_PORT:-18080}:8080"

  uwsgi:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
    environment: *dd-env
    volumes:
      - media:/app/media

  celerybeat:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-celery-beat.sh"]
    environment: *dd-env

  celeryworker:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
    environment: *dd-env
    volumes:
      - media:/app/media

  # Runs the migrations and creates the admin user, then exits.
  initializer:
    image: *dd-image
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dd-env
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: admin
      DD_ADMIN_PASSWORD: "${DOJO_ADMIN_PASSWORD:-Czujka-Lab-2026!}"
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User

  # Sets a known API v2 token for the admin user, then exits. Idempotent.
  token:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
    working_dir: /app
    entrypoint: ["python", "manage.py", "shell", "-c"]
    command:
      - |
        import os
        from django.contrib.auth import get_user_model
        from rest_framework.authtoken.models import Token
        user = get_user_model().objects.get(username="admin")
        Token.objects.filter(user=user).delete()
        Token.objects.create(user=user, key=os.environ["DOJO_API_TOKEN"])
        print("czujka-dojo: API token set for user admin")
    environment:
      <<: *dd-env
      DOJO_API_TOKEN: "${DOJO_API_TOKEN:-c2a1b0f4d7e84c5aa3f29b6e0d1c7f58a4e3b2d1}"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkeydata:/data

volumes:
  pgdata: {}
  media: {}
  valkeydata: {}
