# Czujka test lab. GENERATED by "go run ./lab/gen" from lab/manifest. Do not edit.
# One bridge network 10.66.0.0/16 with fixed addresses. See lab/README.md.
name: czujka-lab

networks:
  lab:
    name: czujka-lab
    driver: bridge
    ipam:
      config:
        - subnet: 10.66.0.0/16
          gateway: 10.66.0.1

volumes:
  lab-state: {}

configs:
  dns-cfg-0:
    content: |
      # generated by lab/gen from lab/manifest; do not edit
      no-resolv
      no-hosts
      no-poll
      user=root
      log-facility=-
      listen-address=0.0.0.0
      bind-interfaces
      domain=lab.czujka.test
      local=/lab.czujka.test/
      local=/66.10.in-addr.arpa/
      host-record=www.lab.czujka.test,10.66.1.10
      host-record=blog.lab.czujka.test,10.66.1.11
      host-record=biblioteka.lab.czujka.test,10.66.1.20
      host-record=repozytorium.lab.czujka.test,10.66.1.30
      host-record=wiki.lab.czujka.test,10.66.1.40
      host-record=static.lab.czujka.test,10.66.2.10
      host-record=www2.lab.czujka.test,10.66.2.11
      host-record=caddy.lab.czujka.test,10.66.2.12
      host-record=hosting.lab.czujka.test,10.66.2.20
      host-record=rekrutacja.lab.czujka.test,10.66.2.20
      host-record=intranet.lab.czujka.test,10.66.2.20
      host-record=tomcat.lab.czujka.test,10.66.3.10
      host-record=oceny-api.lab.czujka.test,10.66.3.11
      host-record=dev-django.lab.czujka.test,10.66.3.12
