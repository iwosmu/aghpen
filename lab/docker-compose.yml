      host-record=cache.lab.czujka.test,10.66.20.12
      host-record=memcache.lab.czujka.test,10.66.20.13
      host-record=ftp.lab.czujka.test,10.66.20.20
      host-record=mail.lab.czujka.test,10.66.20.21
      host-record=mqtt.lab.czujka.test,10.66.20.22
      host-record=ns1.lab.czujka.test,10.66.0.53
      host-record=bastion.lab.czujka.test,10.66.20.30
      host-record=stary-serwer.lab.czujka.test,10.66.20.31
