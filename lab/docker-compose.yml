      host-record=ff.lab.czujka.test,10.66.99.255
      host-record=gw-akademik.lab.czujka.test,10.66.128.1
      host-record=kamera-3.lab.czujka.test,10.66.130.77
      host-record=kiosk-2.lab.czujka.test,10.66.200.200
      host-record=drukarka-2.lab.czujka.test,10.66.255.254
  caddy-cfg-0:
    content: |
      {
      	admin off
      }
      caddy.lab.czujka.test, 10.66.2.12 {
      	tls internal
      	root * /usr/share/caddy
      	file_server
      }
  vhosts-cfg-0:
    content: |
      server {
          listen 80 default_server;
          server_name _;
          default_type "text/html; charset=utf-8";
          location / { return 200 '<!doctype html><html lang="pl"><head><title>Hosting wydziałowy — strona domyślna</title></head><body><h1>Hosting wydziałowy</h1><p>Ten serwer obsługuje kilka witryn. Podaj nazwę witryny.</p></body></html>'; }
      }
      server {
          listen 80;
          server_name rekrutacja.lab.czujka.test;
          default_type "text/html; charset=utf-8";
          location / { return 200 '<!doctype html><html lang="pl"><head><title>Rekrutacja 2026/2027</title><meta name="generator" content="Hugo 0.139.0"></head><body><h1>Rekrutacja 2026/2027</h1><p>Terminy i zasady przyjęć.</p></body></html>'; }
      }
      server {
          listen 80;
          server_name intranet.lab.czujka.test;
          default_type "text/html; charset=utf-8";
          add_header X-Frame-Options SAMEORIGIN always;
          location / { return 200 '<!doctype html><html lang="pl"><head><title>Intranet — logowanie</title></head><body><h1>Intranet</h1><form method="get" action="/login"><input name="user"><input type="password" name="pass"><button>Zaloguj</button></form></body></html>'; }
      }
  portainer-cfg-0:
    content: |
      Lab-Admin-Pass-2026!
  mariadb-cfg-0:
    content: |
      CREATE DATABASE IF NOT EXISTS wp_main;
      CREATE DATABASE IF NOT EXISTS wp_old;
      CREATE DATABASE IF NOT EXISTS wp_new;
      CREATE DATABASE IF NOT EXISTS joomla;
      GRANT ALL PRIVILEGES ON wp_main.* TO 'lab'@'%';
      GRANT ALL PRIVILEGES ON wp_old.* TO 'lab'@'%';
      GRANT ALL PRIVILEGES ON wp_new.* TO 'lab'@'%';
      GRANT ALL PRIVILEGES ON joomla.* TO 'lab'@'%';
      FLUSH PRIVILEGES;
  mqtt-cfg-0:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
      persistence false

services:
  # 10.66.0.10 — skrzynka skanera: nmap, curl, dig (nie jest hostem laboratorium)
  scanner-box:
    image: "czujka-lab/scanner-box:1"
    build:
      context: "./scanner-box"
    hostname: "scanner-box"
    networks:
      lab:
        ipv4_address: 10.66.0.10
    dns: ["10.66.0.53"]
    command: ["sleep", "infinity"]
    volumes: ["lab-state:/lab-state"]
    cap_add: ["NET_RAW", "NET_ADMIN"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "nmap --version >/dev/null"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "tools"

  # 10.66.0.53 — dnsmasq: strefa lab.czujka.test (53/tcp, 53/udp)
  dns:
    image: "czujka-lab/netsvc:1"
    build:
      context: "./images/netsvc"
    hostname: "dns"
    networks:
      lab:
        ipv4_address: 10.66.0.53
    command: ["sh", "-c", "exec dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq-lab.conf"]
    init: true
    configs:
      - source: dns-cfg-0
        target: "/etc/dnsmasq-lab.conf"
        mode: 0444
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nslookup www.lab.czujka.test 127.0.0.1 >/dev/null"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "infra"

  # 10.66.1.10 — WordPress 6.9.4, zainstalowany, aktualny
  wp-main:
    image: "czujka-lab/wordpress:6.9.4-php8.3-apache"
    build:
      context: "./images/wordpress"
      args:
        WP_TAG: "6.9.4-php8.3-apache"
    hostname: "wp-main"
    networks:
      lab:
        ipv4_address: 10.66.1.10
    environment:
      WORDPRESS_DB_HOST: "mariadb"
      WORDPRESS_DB_USER: "lab"
      WORDPRESS_DB_PASSWORD: "lab-db-pass"
      WORDPRESS_DB_NAME: "wp_main"
      LAB_URL: "http://10.66.1.10"
      LAB_TITLE: "Wydział Informatyki AGH (lab)"
      LAB_ADMIN_PASSWORD: "Lab-Admin-Pass-2026!"
    mem_limit: 256m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 -o /dev/null http://127.0.0.1/wp-login.php && test -f /tmp/lab-installed"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.1.11 — WordPress 6.9.4 po aktualizacji (t1, t2)
  wp-new:
    image: "czujka-lab/wordpress:6.9.4-php8.3-apache"
    pull_policy: never
    hostname: "wp-new"
    profiles: ["later"]
    networks:
      lab:
        ipv4_address: 10.66.1.11
    environment:
      WORDPRESS_DB_HOST: "mariadb"
      WORDPRESS_DB_USER: "lab"
      WORDPRESS_DB_PASSWORD: "lab-db-pass"
      WORDPRESS_DB_NAME: "wp_new"
      LAB_URL: "http://10.66.1.11"
      LAB_TITLE: "Blog Koła Naukowego"
      LAB_ADMIN_PASSWORD: "Lab-Admin-Pass-2026!"
    mem_limit: 256m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 -o /dev/null http://127.0.0.1/wp-login.php && test -f /tmp/lab-installed"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.1.11 — WordPress 5.8.3 (przestarzały) w t0; w t1 zastąpiony przez 6.9.4 na tym samym adresie
  wp-old:
    image: "czujka-lab/wordpress:5.8.3-apache"
    build:
      context: "./images/wordpress"
      args:
        WP_TAG: "5.8.3-apache"
    hostname: "wp-old"
    networks:
      lab:
        ipv4_address: 10.66.1.11
    environment:
      WORDPRESS_DB_HOST: "mariadb"
      WORDPRESS_DB_USER: "lab"
      WORDPRESS_DB_PASSWORD: "lab-db-pass"
      WORDPRESS_DB_NAME: "wp_old"
      LAB_URL: "http://10.66.1.11"
      LAB_TITLE: "Blog Koła Naukowego"
      LAB_ADMIN_PASSWORD: "Lab-Admin-Pass-2026!"
    mem_limit: 256m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 -o /dev/null http://127.0.0.1/wp-login.php && test -f /tmp/lab-installed"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.1.20 — Joomla 5.4.10, zainstalowana
  joomla:
    image: "joomla:5.4.10-php8.3-apache"
    hostname: "joomla"
    networks:
      lab:
        ipv4_address: 10.66.1.20
    environment:
      JOOMLA_DB_HOST: "mariadb"
      JOOMLA_DB_USER: "lab"
      JOOMLA_DB_PASSWORD: "lab-db-pass"
      JOOMLA_DB_NAME: "joomla"
      JOOMLA_SITE_NAME: "Biblioteka Glowna"
      JOOMLA_ADMIN_USER: "Lab Admin"
      JOOMLA_ADMIN_USERNAME: "labadmin"
      JOOMLA_ADMIN_PASSWORD: "Lab-Admin-Pass-2026!"
      JOOMLA_ADMIN_EMAIL: "admin@example.com"
    mem_limit: 256m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 http://127.0.0.1/ | grep -qi joomla"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 180s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.1.30 — Drupal 10.6.22, zainstalowany (SQLite)
  drupal:
    image: "czujka-lab/drupal:10.6.22"
    build:
      context: "./images/drupal"
    hostname: "drupal"
    networks:
      lab:
        ipv4_address: 10.66.1.30
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1/user/login"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.1.40 — DokuWiki 2026-07-14c
  dokuwiki:
    image: "dokuwiki/dokuwiki:2026-07-14c"
    hostname: "dokuwiki"
    networks:
      lab:
        ipv4_address: 10.66.1.40
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 -o /dev/null http://127.0.0.1:8080/ || wget -q -T 3 -O /dev/null http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "cms"

  # 10.66.2.10 — nginx 1.30.7 po aktualizacji (t1, t2)
  nginx-new:
    image: "nginx:1.30.7-alpine"
    hostname: "nginx-new"
    profiles: ["later"]
    networks:
      lab:
        ipv4_address: 10.66.2.10
    mem_limit: 32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || curl -fsS -m 3 -o /dev/null http://127.0.0.1:80/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.2.10 — nginx 1.24.0 (strona domyślna) w t0
  nginx-old:
    image: "nginx:1.24.0-alpine"
    hostname: "nginx-old"
    networks:
      lab:
        ipv4_address: 10.66.2.10
    mem_limit: 32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || curl -fsS -m 3 -o /dev/null http://127.0.0.1:80/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.2.11 — Apache httpd 2.4.71 (strona domyślna „It works!”)
  httpd:
    image: "httpd:2.4.71-alpine"
    hostname: "httpd"
    networks:
      lab:
        ipv4_address: 10.66.2.11
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || curl -fsS -m 3 -o /dev/null http://127.0.0.1:80/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.2.12 — Caddy 2.11.9: HTTP → HTTPS, certyfikat z wewnętrznego CA Caddy
  caddy:
    image: "caddy:2.11.9-alpine"
    hostname: "caddy"
    networks:
      lab:
        ipv4_address: 10.66.2.12
    configs:
      - source: caddy-cfg-0
        target: "/etc/caddy/Caddyfile"
        mode: 0444
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null --no-check-certificate https://127.0.0.1/ || nc -z 127.0.0.1 443"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.2.20 — nginx 1.30.7 z wirtualnymi hostami: domyślny, rekrutacja, intranet (logowanie)
  vhosts:
    image: "nginx:1.30.7-alpine"
    hostname: "vhosts"
    networks:
      lab:
        ipv4_address: 10.66.2.20
    configs:
      - source: vhosts-cfg-0
        target: "/etc/nginx/conf.d/default.conf"
        mode: 0444
    mem_limit: 32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || curl -fsS -m 3 -o /dev/null http://127.0.0.1:80/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.2.30 — strona aktualności, która w t1 staje się panelem administracyjnym
  news-site:
    image: "czujka-lab/labsim:1"
    build:
      context: "./."
      dockerfile: "images/labsim/Dockerfile"
    hostname: "news-site"
    networks:
      lab:
        ipv4_address: 10.66.2.30
    environment:
      LABSIM_HOST: "news-site"
    volumes: ["lab-state:/lab-state:ro"]
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labsim.ready"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "web"

  # 10.66.3.10 — Apache Tomcat 10.1.62: strona domyślna i /manager/html (401)
  tomcat:
    image: "czujka-lab/tomcat:10.1.62"
    build:
      context: "./images/tomcat"
    hostname: "tomcat"
    networks:
      lab:
        ipv4_address: 10.66.3.10
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 -o /dev/null http://127.0.0.1:8080/ || wget -q -T 3 -O /dev/null http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "app"

  # 10.66.3.11 — Spring Boot 3.4 z otwartym Actuatorem (/actuator, /actuator/env)
  spring:
    image: "czujka-lab/spring:1"
    build:
      context: "./images/spring"
    hostname: "spring"
    networks:
      lab:
        ipv4_address: 10.66.3.11
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "app"

  # 10.66.3.12 — Django 5.2 w trybie DEBUG (runserver), /admin/
  django:
    image: "czujka-lab/pyapps:1"
    build:
      context: "./images/pyapps"
    hostname: "django"
    networks:
      lab:
        ipv4_address: 10.66.3.12
    command: ["python", "/app/django/manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8000/ || curl -fsS -m 3 -o /dev/null http://127.0.0.1:8000/"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 3s
    labels:
      czujka.lab.group: "app"

  # 10.66.3.13 — Flask 3 za gunicorn 23, ciasteczko sesji o kształcie JWT bez Secure
  flask:
