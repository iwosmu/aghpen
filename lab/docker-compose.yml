      host-record=dev-api.lab.czujka.test,10.66.40.11
      host-record=test.lab.czujka.test,10.66.40.12
      host-record=portal.lab.czujka.test,10.66.50.10
      host-record=selfsigned.lab.czujka.test,10.66.50.11
