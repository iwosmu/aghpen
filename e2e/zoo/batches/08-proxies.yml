# Zoo batch 08: reverse proxies and caches with their admin and stats pages.
services:
  zbackend:
    image: httpd:2.4.71-alpine
  haproxy:
    image: haproxy:3.0.31-alpine
    configs: [{source: haproxy, target: /usr/local/etc/haproxy/haproxy.cfg}]
    ports: ["8404:8404", "18888:8080"]
  envoy:
    image: envoyproxy/envoy:v1.39.6
    configs: [{source: envoy, target: /etc/envoy/envoy.yaml}]
    ports: ["9901:9901", "10000:10000"]
  squid:
    image: ubuntu/squid:6.6-24.04_beta
    ports: ["3128:3128"]
  varnish:
    image: varnish:9.1.0
    environment: {VARNISH_BACKEND_HOST: zbackend, VARNISH_BACKEND_PORT: "80"}
    ports: ["36081:80"]
configs:
  haproxy:
    content: |
      global
        log stdout format raw local0
      defaults
        mode http
        timeout connect 5s
        timeout client 30s
        timeout server 30s
      frontend stats
        bind :8404
        stats enable
        stats uri /stats
        stats refresh 10s
      frontend web
        bind :8080
        default_backend app
      backend app
        server s1 zbackend:80
  envoy:
    content: |
      admin:
        address: {socket_address: {address: 0.0.0.0, port_value: 9901}}
      static_resources:
        listeners:
        - name: web
          address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
          filter_chains:
          - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: web
                route_config:
                  virtual_hosts:
                  - name: all
                    domains: ["*"]
                    routes: [{match: {prefix: "/"}, route: {cluster: backend}}]
                http_filters:
                - name: envoy.filters.http.router
                  typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
        clusters:
        - name: backend
          type: STRICT_DNS
          load_assignment:
            cluster_name: backend
            endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: zbackend, port_value: 80}}}}]}]
